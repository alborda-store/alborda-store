    <!-- Page-Specific JavaScript for Products -->
    <script>
        // تهيئة Firebase
        if (typeof firebaseConfig !== 'undefined') {
            try {
                firebase.initializeApp(firebaseConfig);
                console.log("Firebase initialized successfully on products page.");
                observeAuthState(); // مراقبة حالة المصادقة لتحديث الهيدر
            } catch (error) {
                console.error("Error initializing Firebase:", error);
                displayStatusMessage("حدث خطأ في تهيئة الاتصال. يرجى تحديث الصفحة.", "error");
            }
        } else {
            console.error("Firebase config is not defined. Check firebase-config.js");
            displayStatusMessage("خطأ في تحميل إعدادات التطبيق.", "error");
        }

        const productsGrid = document.getElementById("products-grid");
        const statusMessage = document.getElementById("products-status-message");
        const applyFiltersButton = document.getElementById("apply-filters-button");
        const searchTermInput = document.getElementById("search-term");
        const categoryFilter = document.getElementById("filter-category");
        const sortFilter = document.getElementById("filter-sort");

        /**
         * عرض رسالة حالة (تحميل، خطأ، لا توجد نتائج).
         * @param {string} message - نص الرسالة.
         * @param {'info' | 'error' | 'success'} type - نوع الرسالة.
         */
        function displayStatusMessage(message, type = 'info') {
            if (!statusMessage) return;
            statusMessage.textContent = message;
            statusMessage.classList.remove('hidden', 'text-red-500', 'text-gray-500');
            if (type === 'error') {
                statusMessage.classList.add('text-red-500');
            } else {
                statusMessage.classList.add('text-gray-500');
            }
            statusMessage.classList.remove('hidden');
        }

        /**
         * إخفاء رسالة الحالة.
         */
        function hideStatusMessage() {
            if (statusMessage) statusMessage.classList.add('hidden');
        }

        /**
         * عرض العناصر النائبة (Placeholders) أثناء التحميل.
         */
        function showPlaceholders() {
            if (!productsGrid) return;
            productsGrid.innerHTML = ''; // مسح المحتوى القديم
            // إضافة عدد مناسب من العناصر النائبة
            for (let i = 0; i < 8; i++) {
                const placeholder = document.createElement('div');
                placeholder.className = 'product-placeholder bg-white rounded-lg shadow overflow-hidden animate-pulse';
                placeholder.innerHTML = `
                    <div class="w-full h-48 bg-gray-300"></div>
                    <div class="p-4">
                        <div class="h-4 bg-gray-300 rounded w-3/4 mb-2"></div>
                        <div class="h-4 bg-gray-300 rounded w-1/2"></div>
                    </div>
                `;
                // إخفاء بعض العناصر النائبة على الشاشات المختلفة لمحاكاة الشبكة
                if (i >= 4 && i < 6) placeholder.classList.add('hidden', 'md:block');
                if (i >= 6) placeholder.classList.add('hidden', 'lg:block');
                productsGrid.appendChild(placeholder);
            }
            hideStatusMessage();
        }

        /**
         * تحميل وعرض المنتجات بناءً على الفلاتر والبحث.
         */
        async function loadAndDisplayProducts() {
            if (!firebase.apps.length) {
                console.warn("Firebase not ready yet.");
                displayStatusMessage("جاري تهيئة الاتصال...", "info");
                return;
            }
            if (!productsGrid) return;

            console.log("Loading products...");
            showPlaceholders(); // عرض العناصر النائبة

            const db = firebase.firestore();
            const searchTerm = searchTermInput.value.trim().toLowerCase();
            const category = categoryFilter.value;
            const sortBy = sortFilter.value;

            const options = {
                sortBy: sortBy,
                // لا يمكن تطبيق فلتر الفئة مباشرة مع البحث النصي الكامل في Firestore بكفاءة
                // سنقوم بجلب المنتجات ثم تصفيتها من جانب العميل للبحث والفئة
                // إذا كانت الفئة محددة، يمكن استخدامها كشرط where
                category: (category !== 'all') ? category : null
            };

            try {
                // استخدام دالة fetchProducts من firestore.js
                let products = await fetchProducts(db, options);

                // 1. تصفية حسب الفئة (إذا لم يتم تطبيقها في الاستعلام)
                if (!options.category && category !== 'all') {
                    products = products.filter(p => p.category === category);
                }

                // 2. تصفية حسب مصطلح البحث (بحث بسيط في الاسم والوصف)
                if (searchTerm) {
                    products = products.filter(p =>
                        (p.name && p.name.toLowerCase().includes(searchTerm)) ||
                        (p.description && p.description.toLowerCase().includes(searchTerm))
                    );
                }

                productsGrid.innerHTML = ''; // مسح العناصر النائبة أو النتائج القديمة

                if (products.length === 0) {
                    displayStatusMessage("لم يتم العثور على منتجات تطابق بحثك.", "info");
                    return;
                }

                hideStatusMessage();

                products.forEach(product => {
                    const productCard = document.createElement("div");
                    productCard.classList.add("bg-white", "rounded-lg", "shadow", "overflow-hidden", "group", "flex", "flex-col"); // flex-col لتثبيت الزر بالأسفل
                    productCard.innerHTML = `
                        <a href="product-details.html?id=${product.id}" class="block">
                            <img src="${product.imageUrl || 'assets/images/placeholder.png'}" alt="${product.name}" class="w-full h-48 object-cover group-hover:opacity-90 transition-opacity">
                        </a>
                        <div class="p-4 flex flex-col flex-grow"> <!-- flex-grow لدفع الزر للأسفل -->
                            <h3 class="font-semibold mb-1 flex-grow">
                                <a href="product-details.html?id=${product.id}" class="text-gray-800 hover:text-primary line-clamp-2">${product.name}</a>
                            </h3>
                            <p class="text-primary font-bold mb-3">$${product.price.toFixed(2)}</p>
                            <button onclick="handleAddToCartClick('${product.id}', '${product.name}', ${product.price}, '${product.imageUrl || ''}')" class="mt-auto w-full bg-primary text-white py-2 px-4 rounded hover:bg-opacity-90 transition duration-300 text-sm">
                                <i class="fas fa-cart-plus mr-1 ml-1"></i> إضافة للسلة
                            </button>
                        </div>
                    `;
                    productsGrid.appendChild(productCard);
                });

            } catch (error) {
                console.error("Error loading products:", error);
                productsGrid.innerHTML = ''; // مسح العناصر النائبة
                displayStatusMessage("حدث خطأ أثناء تحميل المنتجات. يرجى المحاولة مرة أخرى.", "error");
            }
        }

        /**
         * معالج النقر على زر إضافة للسلة من صفحة المنتجات.
         * @param {string} id
         * @param {string} name
         * @param {number} price
         * @param {string} imageUrl
         */
        function handleAddToCartClick(id, name, price, imageUrl) {
            // نفترض عدم وجود خيار للمقاس في صفحة قائمة المنتجات
            const product = { id, name, price, imageUrl };
            addToCart(product, 1, null); // استخدام دالة addToCart من cart.js
            // يمكنك إضافة رسالة تأكيد مرئية هنا باستخدام showUserMessage
            // مثال:
            // showUserMessage("cart-feedback", `تمت إضافة ${name} للسلة!`, "success", 3000);
            // تأكد من وجود عنصر <div id="cart-feedback"></div> في مكان مناسب بالصفحة
        }

        // ربط حدث النقر بزر تطبيق الفلاتر
        if (applyFiltersButton) {
            applyFiltersButton.addEventListener("click", loadAndDisplayProducts);
        }
        // ربط حدث الضغط على Enter في حقل البحث
        if (searchTermInput) {
            searchTermInput.addEventListener("keypress", (event) => {
                if (event.key === "Enter") {
                    loadAndDisplayProducts();
                }
            });
        }

        // تحميل المنتجات عند تحميل الصفحة لأول مرة
        document.addEventListener("DOMContentLoaded", () => {
            // تأخير بسيط للتأكد من تهيئة Firebase
            setTimeout(() => {
                 if (typeof firebase !== 'undefined' && firebase.apps.length > 0) {
                    loadAndDisplayProducts();
                 } else {
                     // محاولة أخرى بعد فترة أطول قليلاً
                     setTimeout(loadAndDisplayProducts, 1500);
                 }
            }, 500);
        });

    </script>
