<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر البردة - تسجيل الدخول</title>

    <!-- ربط Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {}
            }
        }
    </script>

    <!-- ربط ملف الأنماط المخصص -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- تعليق: إضافة أي روابط أو ميتا تاجات أخرى ضرورية هنا -->

</head>
<body class="bg-gray-100 font-sans flex items-center justify-center min-h-screen">

    <!-- حاوية نموذج تسجيل الدخول -->
    <main class="bg-white p-8 rounded-lg shadow-lg max-w-sm w-full">
        <div class="text-center mb-8">
            <a href="index.html" class="text-2xl font-bold text-indigo-600">متجر البردة</a>
            <h1 class="text-xl font-semibold text-gray-700 mt-2">تسجيل الدخول</h1>
        </div>

        <!-- رسالة خطأ عامة -->
        <p id="login-error-message" class="text-sm text-red-600 mb-4 text-center hidden"></p>

        <!-- أزرار تسجيل الدخول عبر OAuth -->
        <div class="space-y-4">
            <!-- زر تسجيل الدخول بحساب جوجل -->
            <button id="google-signin-button" class="w-full bg-red-600 text-white py-2 px-4 rounded-lg hover:bg-red-700 transition duration-300 flex items-center justify-center space-x-2 space-x-reverse">
                <!-- يمكنك إضافة أيقونة جوجل هنا -->
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21.35 11.1H12.18V13.83H18.69C18.36 15.63 17.16 17.14 15.38 18.26V20.75H18.98C20.92 18.97 21.94 16.37 21.94 13.22C21.94 12.45 21.85 11.75 21.7 11.1H21.35Z"/><path d="M12.18 22.0001C15.04 22.0001 17.45 21.0801 18.98 19.5701L15.38 17.0801C14.48 17.7201 13.4 18.1001 12.18 18.1001C9.67 18.1001 7.58 16.3401 6.78 13.9901H3.09V16.5701C4.63 19.7101 8.14 22.0001 12.18 22.0001Z"/><path d="M6.78 13.99C6.58 13.35 6.48 12.68 6.48 12C6.48 11.32 6.58 10.65 6.78 10.01V7.43H3.09C2.03 9.49 1.5 11.7 1.5 14C1.5 16.3 2.03 18.51 3.09 20.57L6.78 18.01V13.99Z"/><path d="M12.18 5.89996C13.59 5.89996 14.8 6.39996 15.74 7.29996L19.05 4.20996C17.45 2.79996 15.04 1.98996 12.18 1.98996C8.14 1.98996 4.63 4.28996 3.09 7.42996L6.78 9.99996C7.58 7.64996 9.67 5.89996 12.18 5.89996Z"/></svg>
                <span>تسجيل الدخول باستخدام Google</span>
            </button>

            <!-- زر تسجيل الدخول بحساب فيسبوك -->
            <button id="facebook-signin-button" class="w-full bg-blue-800 text-white py-2 px-4 rounded-lg hover:bg-blue-900 transition duration-300 flex items-center justify-center space-x-2 space-x-reverse">
                <!-- يمكنك إضافة أيقونة فيسبوك هنا -->
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H8v-3h2V9.5C10 7.57 11.57 6 13.5 6H16v3h-1.5c-.83 0-1 .47-1 1v2h3l-.5 3h-2.5v6.8c4.56-.93 8-4.96 8-9.8z"/></svg>
                <span>تسجيل الدخول باستخدام Facebook</span>
            </button>
        </div>

        <!-- فاصل (أو) -->
        <div class="my-6 flex items-center justify-center">
            <span class="border-t flex-grow"></span>
            <span class="px-3 text-sm text-gray-500">أو</span>
            <span class="border-t flex-grow"></span>
        </div>

        <!-- رابط للعودة للصفحة الرئيسية أو استكشاف المنتجات -->
        <div class="text-center text-sm text-gray-600">
            <a href="index.html" class="text-indigo-600 hover:underline">العودة إلى الصفحة الرئيسية</a>
        </div>

    </main>

    <!-- ======== تضمين Firebase SDKs ======== -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script> <!-- لحفظ بيانات المستخدم بعد التسجيل -->

    <!-- ======== تضمين ملفات JavaScript ======== -->
    <script src="js/firebase-config.js"></script>
    <!-- <script src="js/ui.js"></script> --> <!-- قد لا نحتاج ui.js هنا -->
    <script src="js/auth.js"></script> <!-- الملف الرئيسي لهذه الصفحة -->
    <script src="js/firestore.js"></script> <!-- لحفظ بيانات المستخدم -->

    <!-- تهيئة Firebase وربط الأحداث -->
    <script>
        try {
            firebase.initializeApp(firebaseConfig);
            console.log("Firebase Initialized Successfully on Login Page!");

            const auth = firebase.auth();
            const db = firebase.firestore();

            const googleButton = document.getElementById('google-signin-button');
            const facebookButton = document.getElementById('facebook-signin-button');
            const errorMessage = document.getElementById('login-error-message');

            // دالة لمعالجة نجاح تسجيل الدخول
            const handleLoginSuccess = (result) => {
                console.log("Login successful:", result.user);
                const user = result.user;
                // حفظ أو تحديث بيانات المستخدم في Firestore
                saveOrUpdateUser(user, db).then(() => {
                    // التحقق من وجود معلمة إعادة التوجيه في الرابط
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect') || 'index.html'; // الافتراضي هو index.html
                    // إعادة التوجيه إلى الصفحة المطلوبة أو الصفحة الرئيسية
                    window.location.href = redirectUrl;
                }).catch(err => {
                     console.error("Error saving user data:", err);
                     errorMessage.textContent = "حدث خطأ أثناء حفظ بيانات المستخدم.";
                     errorMessage.classList.remove('hidden');
                });
            };

            // دالة لمعالجة فشل تسجيل الدخول
            const handleLoginFailure = (error) => {
                console.error("Login failed:", error);
                // عرض رسالة خطأ مناسبة للمستخدم
                let userMessage = "حدث خطأ غير متوقع أثناء تسجيل الدخول.";
                if (error.code === 'auth/account-exists-with-different-credential') {
                    userMessage = "يوجد حساب مرتبط بهذا البريد الإلكتروني ولكن ببيانات اعتماد مختلفة. حاول تسجيل الدخول بالطريقة الأخرى.";
                } else if (error.code === 'auth/popup-closed-by-user') {
                    userMessage = "تم إلغاء عملية تسجيل الدخول.";
                } else if (error.code === 'auth/cancelled-popup-request') {
                    // تجاهل هذا الخطأ إذا كان هناك طلب نافذة منبثقة آخر قيد التقدم
                    return;
                }
                errorMessage.textContent = userMessage;
                errorMessage.classList.remove('hidden');
            };

            // ربط حدث النقر لزر جوجل
            if (googleButton) {
                googleButton.addEventListener('click', () => {
                    errorMessage.classList.add('hidden'); // إخفاء رسالة الخطأ السابقة
                    const provider = new firebase.auth.GoogleAuthProvider();
                    auth.signInWithPopup(provider)
                        .then(handleLoginSuccess)
                        .catch(handleLoginFailure);
                });
            }

            // ربط حدث النقر لزر فيسبوك
            if (facebookButton) {
                facebookButton.addEventListener('click', () => {
                    errorMessage.classList.add('hidden'); // إخفاء رسالة الخطأ السابقة
                    const provider = new firebase.auth.FacebookAuthProvider();
                    auth.signInWithPopup(provider)
                        .then(handleLoginSuccess)
                        .catch(handleLoginFailure);
                });
            }

            // مراقبة حالة المصادقة لإعادة التوجيه إذا كان المستخدم مسجلاً بالفعل
            auth.onAuthStateChanged((user) => {
                if (user) {
                    console.log("User already logged in, redirecting...");
                    // إذا كان المستخدم مسجلاً الدخول بالفعل، قم بإعادة توجيهه
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirectUrl = urlParams.get('redirect') || 'index.html';
                    window.location.href = redirectUrl;
                }
            });

        } catch (error) {
            console.error("Error initializing Firebase on Login Page:", error);
            const errorMessage = document.getElementById('login-error-message');
            if (errorMessage) {
                errorMessage.textContent = "حدث خطأ في تهيئة خدمة المصادقة.";
                errorMessage.classList.remove('hidden');
            }
        }
    </script>

</body>
</html>
